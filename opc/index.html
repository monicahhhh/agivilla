<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#000000" />
<title>OPC 出海地图｜Monica Wang</title>
<meta name="description" content="OPC 出海地图｜Monica Wang · AWS 分享" />
<link rel="canonical" href="https://opc.agivilla.com/" />
<meta property="og:title" content="OPC 出海地图｜Monica Wang" />
<meta property="og:description" content="OPC 出海地图｜Monica Wang · AWS 分享" />
<meta property="og:url" content="https://opc.agivilla.com/" />
<meta property="og:type" content="website" />
<style>
  html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;}
  body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;}
  #stage{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;}
  .slide{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;opacity:0;pointer-events:none;transition:opacity 360ms cubic-bezier(.22,.61,.36,1);}
  .slide.active{opacity:1;z-index:2;}
  .slide.leaving{opacity:0;z-index:1;}
  #left,#right{position:fixed;top:0;bottom:0;width:50%;z-index:5;background:transparent;}
  #left{left:0;cursor:w-resize;}
  #right{right:0;cursor:e-resize;}
  .brand-logo{position:fixed;right:clamp(16px,2vw,28px);bottom:clamp(16px,2.2vh,26px);z-index:8;width:clamp(72px,6.8vw,102px);height:auto;pointer-events:none;opacity:.9;object-fit:contain;}
  @media (prefers-reduced-motion: reduce){.slide{transition:none;}}
  @media (max-width:900px){.brand-logo{width:72px;bottom:14px;right:14px;}}
  @media print{
    html,body{overflow:visible;background:white;height:auto;}
    #stage{position:static;display:block;}
    .slide{position:static;width:100%;height:auto;opacity:1!important;page-break-after:always;display:block;}
    #left,#right,.brand-logo{display:none;}
  }
</style>
</head>
<body>
<div id="stage" aria-label="OPC 出海地图演示文稿"></div>
<div id="left" aria-label="上一页"></div>
<div id="right" aria-label="下一页"></div>
<img class="brand-logo" src="agivilla-logo.png" alt="AGIVilla" />
<script>
const sources=['slides/01.png',
'slides/02.png',
'slides/03.png',
'slides/04.png',
'slides/05.png',
'slides/06.png',
'slides/07.png',
'slides/08.png',
'slides/09.png',
'slides/10.png',
'slides/11.png?v=2',
'slides/12.png',
'slides/13.png',
'slides/14.png',
'slides/15.png',
'slides/16.png',
'slides/17.png',
'slides/18.png'];
const stage=document.getElementById('stage');
const slides=sources.map((src,i)=>{
  const img=new Image();
  img.className='slide'+(i===0?' active':'');
  img.src=src;
  img.alt=`Slide ${i+1} of ${sources.length}`;
  img.draggable=false;
  stage.appendChild(img);
  return img;
});
let current=0, locked=false;
function show(next, push=true){
  next=Math.max(0,Math.min(slides.length-1,next));
  if(next===current||locked)return;
  locked=true;
  const old=slides[current], neu=slides[next];
  neu.classList.add('active');
  old.classList.add('leaving');
  old.classList.remove('active');
  const done=()=>{old.classList.remove('leaving');locked=false;};
  setTimeout(done,390);
  current=next;
  if(push) history.replaceState(null,'','#slide-'+(current+1));
}
function next(){show(current+1)}
function prev(){show(current-1)}

document.getElementById('right').addEventListener('click',next);
document.getElementById('left').addEventListener('click',prev);
window.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();next();}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();prev();}
  else if(e.key==='Home'){e.preventDefault();show(0);}
  else if(e.key==='End'){e.preventDefault();show(slides.length-1);}
  else if(e.key.toLowerCase()==='f'){
    e.preventDefault();
    if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }
});
let sx=0,sy=0;
window.addEventListener('touchstart',e=>{const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY;},{passive:true});
window.addEventListener('touchend',e=>{
  const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.2){dx<0?next():prev();}
},{passive:true});
const h=location.hash.match(/slide-(\d+)/);
if(h){
  const n=Math.max(0,Math.min(slides.length-1,+h[1]-1));
  if(n){slides[0].classList.remove('active');slides[n].classList.add('active');current=n;}
} else {
  history.replaceState(null,'','#slide-1');
}
</script>
</body>
</html>
